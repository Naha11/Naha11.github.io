<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30">
  <!-- Знак — символ контраста: круг, наполовину светлый, наполовину тёмный.
       Чёрное на белом даёт 21:1, наибольшее отношение, какое бывает,
       поэтому на 30 пикселях знак читается и в светлой теме, и в тёмной.
       Квадрат нарисован во всё поле: скругление Framer добавляет сам. -->
  <rect width="30" height="30" fill="#111111"/>
  <path d="M15 6 A9 9 0 0 1 15 24 Z" fill="#ffffff"/>
  <circle cx="15" cy="15" r="9" fill="none" stroke="#ffffff" stroke-width="2.5"/>
</svg>
